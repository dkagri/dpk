<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Shop</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:0;}
header{background:#0d6efd;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center;}
header h2{margin:0;}
.cart{cursor:pointer;}
.products{padding:20px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;}
.card{background:#fff;padding:15px;border-radius:10px;box-shadow:0 5px 10px rgba(0,0,0,.1);text-align:center;}
.card img{width:100%;height:180px;object-fit:contain;}
.price{color:#0d6efd;font-weight:bold;margin:5px 0;}
select,button{width:100%;padding:8px;margin-top:5px;}
button{background:#0d6efd;color:#fff;border:none;border-radius:5px;}
#cartModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);}
.cartBox{background:#fff;max-width:400px;margin:80px auto;padding:15px;border-radius:10px;}
.cartItem{display:flex;justify-content:space-between;margin:8px 0;}
.cartItem button{width:auto;padding:5px 8px;}
#checkout{display:none;padding:20px;}
input{width:100%;padding:10px;margin:8px 0;}
.whatsapp{background:#25d366;color:#fff;padding:12px;border:none;width:100%;}
@media(max-width:600px){.grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<header>
  <h2>Live Online Shop</h2>
  <div class="cart" onclick="openCart()">🛒 Cart (<span id="cartCount">0</span>)</div>
</header>

<section class="products">
  <div class="grid" id="productGrid"></div>
</section>

<!-- CART MODAL -->
<div id="cartModal">
  <div class="cartBox">
    <h3>Your Cart</h3>
    <div id="cartItems"></div>
    <h4>Total: Rs.<span id="total">0</span></h4>
    <button onclick="goCheckout()">Checkout</button>
    <button onclick="closeCart()">Close</button>
  </div>
</div>

<!-- CHECKOUT -->
<div id="checkout">
  <h2>Checkout</h2>
  <input id="name" placeholder="Your Name">
  <input id="phone" placeholder="Phone Number">
  <input id="address" placeholder="Address">
  <button class="whatsapp" onclick="whatsappOrder()">Order via WhatsApp</button>
</div>

<script>
// ===== CONFIG =====
const sheetUrl = "https://docs.google.com/spreadsheets/d/1889ifokv_12i44p9yqqqQz0vJfn9W_ne/edit?usp=drivesdk&ouid=111106518495826787577&rtpof=true&sd=true";
let cart = JSON.parse(localStorage.getItem("cart")) || [];
updateCartCount();

// ===== LOAD PRODUCTS =====
fetch(sheetUrl)
.then(res => res.text())
.then(data => {
  const rows = data.split("\n").slice(1); // skip header
  let html = "";
  rows.forEach((row,i)=>{
    if(!row) return;
    const cols = row.split(",");
    const id = cols[0];
    const name = cols[1];
    const price = parseFloat(cols[2]);
    const mainImg = cols[4];

    html += `
      <div class="card">
        <img src="${mainImg}" alt="${name}">
        <h3>${name}</h3>
        <div class="price">Rs. ${price}</div>
        <select id="qty-${id}">
          <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
        </select>
        <button onclick="addToCart('${name}',${price},'qty-${id}')">Add to Cart</button>
      </div>
    `;
  });
  document.getElementById("productGrid").innerHTML = html;
});

// ===== CART FUNCTIONS =====
function addToCart(name, price, qtyId){
  let qty = parseInt(document.getElementById(qtyId).value);
  let item = cart.find(p => p.name === name);
  if(item){ item.qty += qty; }
  else{ cart.push({name, price, qty}); }
  saveCart();
}

function saveCart(){
  localStorage.setItem("cart", JSON.stringify(cart));
  updateCartCount();
}

function updateCartCount(){
  let count = 0; cart.forEach(i=>count+=i.qty);
  document.getElementById("cartCount").innerText = count;
}

// Cart UI
function openCart(){ document.getElementById("cartModal").style.display="block"; renderCart();}
function closeCart(){ document.getElementById("cartModal").style.display="none";}

function renderCart(){
  let box=document.getElementById("cartItems"); let total=0; box.innerHTML="";
  cart.forEach((i,idx)=>{
    total+=i.price*i.qty;
    box.innerHTML+=`
    <div class="cartItem">
      <div>${i.name}<br>Rs.${i.price} x ${i.qty}</div>
      <div>
        <button onclick="changeQty(${idx},1)">+</button>
        <button onclick="changeQty(${idx},-1)">-</button>
        <button onclick="removeItem(${idx})">❌</button>
      </div>
    </div>`;
  });
  document.getElementById("total").innerText=total;
}

function changeQty(i,c){ cart[i].qty+=c; if(cart[i].qty<=0) cart.splice(i,1); saveCart(); renderCart();}
function removeItem(i){ cart.splice(i,1); saveCart(); renderCart();}

// Checkout
function goCheckout(){
  closeCart();
  document.querySelector(".products").style.display="none";
  document.getElementById("checkout").style.display="block";
}

// WhatsApp Order
function whatsappOrder(){
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const address = document.getElementById("address").value;
  if(!name || !phone || !address){ alert("Fill all fields"); return; }

  let msg=`Hello, I want to order:%0AName: ${name}%0APhone: ${phone}%0AAddress: ${address}%0A`;
  let total=0;
  cart.forEach(i=>{ msg+=`${i.name} x ${i.qty} = Rs.${i.price*i.qty}%0A`; total+=i.price*i.qty; });
  msg+=`%0ATotal: Rs.${total}`;
  window.open(`https://wa.me/94725989935?text=${msg}`);
}
</script>

</body>
  </html>
