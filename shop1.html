<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Shop</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
header{background:#0d6efd;color:#fff;padding:15px;display:flex;justify-content:space-between}
.cart{cursor:pointer}

/* PRODUCT GRID */
.products{padding:20px}
.grid{display:grid;gap:20px}

/* Desktop 5 products */
@media(min-width:1200px){.grid{grid-template-columns:repeat(5,1fr)}}
/* Tablet */
@media(max-width:1199px){.grid{grid-template-columns:repeat(3,1fr)}}
/* Mobile */
@media(max-width:600px){.grid{grid-template-columns:1fr}}

.card{
  background:#fff;padding:15px;border-radius:10px;
  box-shadow:0 5px 10px rgba(0,0,0,.1);text-align:center
}
.card img{width:100%;height:160px;object-fit:contain}
.price{color:#0d6efd;font-weight:bold}
select,button{width:100%;padding:8px;margin-top:5px}
button{background:#0d6efd;color:#fff;border:none;border-radius:5px}

/* CART BAR */
.cart-bar{
  position:sticky;bottom:0;background:#fff;
  padding:10px;box-shadow:0 -2px 5px rgba(0,0,0,.1);
  display:flex;justify-content:space-between;align-items:center
}

/* CART MODAL */
#cartModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5)}
.cartBox{background:#fff;max-width:400px;margin:80px auto;padding:15px;border-radius:10px}
.cartItem{display:flex;justify-content:space-between;margin:8px 0}

/* CHECKOUT */
#checkout{display:none;padding:20px}
input{width:100%;padding:10px;margin:6px 0}
.whatsapp{background:#25d366;color:#fff;padding:12px;border:none;width:100%}

/* Pagination */
.pagination{text-align:center;margin:20px}
.pagination button{width:auto;margin:0 5px}

/* Footer */
footer{
  background:#222;color:#fff;text-align:center;
  padding:15px;font-size:14px
}

/* Floating WhatsApp */
.whatsapp-float{
  position:fixed;bottom:80px;right:20px;
  background:#25d366;color:#fff;
  font-size:26px;padding:15px;border-radius:50%
}
</style>
</head>

<body>

<header>
  <h2>Live Online Shop</h2>
  <div class="cart" onclick="openCart()">🛒 Cart (<span id="cartCount">0</span>)</div>
</header>

<section class="products">
  <div class="grid" id="productGrid"></div>
</section>

<div class="pagination">
  <button onclick="prevPage()">⬅ Prev</button>
  <span id="pageInfo"></span>
  <button onclick="nextPage()">Next ➡</button>
</div>

<!-- CART BAR -->
<div class="cart-bar">
  <div>Total Items: <span id="cartCountBottom">0</span></div>
  <button onclick="openCart()">View Cart</button>
</div>

<!-- CART MODAL -->
<div id="cartModal">
  <div class="cartBox">
    <h3>Your Cart</h3>
    <div id="cartItems"></div>
    <h4>Total: Rs.<span id="total">0</span></h4>
    <button onclick="goCheckout()">Checkout</button>
    <button onclick="closeCart()">Close</button>
  </div>
</div>

<!-- CHECKOUT -->
<div id="checkout">
  <h2>Checkout</h2>
  <input id="name" placeholder="Your Name">
  <input id="phone" placeholder="Phone Number">
  <input id="address" placeholder="Address">
  <button class="whatsapp" onclick="whatsappOrder()">Order via WhatsApp</button>
</div>

<!-- Floating WhatsApp -->
<a href="https://wa.me/94725989935" target="_blank" class="whatsapp-float">
  <i class="fab fa-whatsapp"></i>
</a>

<footer>
  © 2026 Live Online Shop. All Rights Reserved.
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
const sheetUrl="https://docs.google.com/spreadsheets/d/e/2PACX-1vT-khzV32sk21nggqEKQ083HEbitHgS4ojE9z7T7Y9qvQ_JRCHcWBhq-HPT3W8fPA/pub?output=csv";

let products=[],cart=JSON.parse(localStorage.getItem("cart"))||[];
let page=1,perPage=20;

Papa.parse(sheetUrl,{
 download:true,header:true,
 complete:r=>{products=r.data;render()}
});

function render(){
 let start=(page-1)*perPage,end=start+perPage;
 let html="";
 products.slice(start,end).forEach((p,i)=>{
 html+=`
 <div class="card">
  <img src="${p['Main Image']}">
  <h4>${p['Product Name']}</h4>
  <div class="price">Rs.${p['Price (Rs)']}</div>
  <select id="q${i}">${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join("")}</select>
  <button onclick="add('${p['Product Name']}',${p['Price (Rs)']},'q${i}')">Add to Cart</button>
 </div>`;
 });
 document.getElementById("productGrid").innerHTML=html;
 document.getElementById("pageInfo").innerText=`Page ${page}`;
}

function nextPage(){if(page*perPage<products.length){page++;render()}}
function prevPage(){if(page>1){page--;render()}}

function add(n,p,q){
 let qty=parseInt(document.getElementById(q).value);
 let f=cart.find(i=>i.name===n);
 f?f.qty+=qty:cart.push({name:n,price:p,qty});
 save();
}

function save(){
 localStorage.setItem("cart",JSON.stringify(cart));
 let c=cart.reduce((a,b)=>a+b.qty,0);
 cartCount.innerText=cartCountBottom.innerText=c;
}

function openCart(){cartModal.style.display="block";showCart()}
function closeCart(){cartModal.style.display="none"}

function showCart(){
 let t=0,box=cartItems;box.innerHTML="";
 cart.forEach((i,x)=>{
 t+=i.price*i.qty;
 box.innerHTML+=`
 <div class="cartItem">
  ${i.name} x ${i.qty}
  <button onclick="cart.splice(${x},1);save();showCart()">❌</button>
 </div>`;
 });
 total.innerText=t;
}

function goCheckout(){
 closeCart();document.querySelector(".products").style.display="none";
 checkout.style.display="block";
}

function whatsappOrder(){
 let m=`Order:%0A`;
 cart.forEach(i=>m+=`${i.name} x ${i.qty}%0A`);
 window.open(`https://wa.me/94725989935?text=${m}`);
}
save();
</script>

</body>
</html>
