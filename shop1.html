<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Shop</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
header{background:#0d6efd;color:#fff;padding:15px;display:flex;justify-content:space-between}
.cart{cursor:pointer}

.products{padding:20px}
.grid{display:grid;gap:20px}

@media(min-width:1200px){.grid{grid-template-columns:repeat(5,1fr)}}
@media(max-width:1199px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}

.card{
 background:#fff;padding:15px;border-radius:10px;
 box-shadow:0 5px 10px rgba(0,0,0,.1);text-align:center
}
.card img{width:100%;height:160px;object-fit:contain;cursor:pointer}
.price{color:#0d6efd;font-weight:bold}
select,button{width:100%;padding:8px;margin-top:5px}
button{background:#0d6efd;color:#fff;border:none;border-radius:5px}

.cart-bar{
 position:sticky;bottom:0;background:#fff;
 padding:10px;box-shadow:0 -2px 5px rgba(0,0,0,.1);
 display:flex;justify-content:space-between;align-items:center
}

#cartModal,#productModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5)}
.cartBox,.productBox{
 background:#fff;max-width:400px;margin:80px auto;
 padding:15px;border-radius:10px
}
.cartItem{display:flex;justify-content:space-between;margin:8px 0}

.whatsapp{background:#25d366;color:#fff;padding:12px;border:none;width:100%}

.pagination{text-align:center;margin:20px}
.pagination button{width:auto;margin:0 5px}

footer{
 background:#222;color:#fff;text-align:center;
 padding:15px;font-size:14px
}

.whatsapp-float{
 position:fixed;bottom:80px;right:20px;
 background:#25d366;color:#fff;
 font-size:40px;padding:10px;border-radius:50%
}

/* 🔄 Skeleton Loader */
.skeleton{
 background:linear-gradient(90deg,#eee,#f5f5f5,#eee);
 height:260px;border-radius:10px;
 animation:shimmer 1.5s infinite;
}
@keyframes shimmer{
 0%{background-position:-400px}
 100%{background-position:400px}
}
</style>
</head>

<body>

<header>
 <h2>Live Online Shop</h2>
 <div class="cart" onclick="openCart()">🛒 Cart (<span id="cartCount">0</span>)</div>
</header>

<section class="products">
 <div class="grid" id="productGrid"></div>
</section>

<div class="pagination">
 <button onclick="prevPage()">⬅ Prev</button>
 <span id="pageInfo"></span>
 <button onclick="nextPage()">Next ➡</button>
</div>

<div class="cart-bar">
 <div>Total Items: <span id="cartCountBottom">0</span></div>
 <button onclick="openCart()">View Cart</button>
</div>

<div id="cartModal">
 <div class="cartBox">
  <h3>Your Cart</h3>
  <div id="cartItems"></div>
  <h4>Total: Rs.<span id="total">0</span></h4>
  <button class="whatsapp" onclick="whatsappOrder()">Order via WhatsApp</button>
  <button onclick="closeCart()">Close</button>
 </div>
</div>

<div id="productModal">
 <div class="productBox">
  <h3 id="pName"></h3>
  <img id="pImg" style="width:100%;height:200px;object-fit:contain">
  <p id="pDesc"></p>
  <p class="price">Rs.<span id="pPrice"></span></p>
  <button onclick="closeProduct()">Close</button>
 </div>
</div>

<a href="https://wa.me/94725989935" target="_blank" class="whatsapp-float">
 <i class="fab fa-whatsapp"></i>
</a>

<footer>© 2026 Live Online Shop. All Rights Reserved.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
const sheetUrl="https://docs.google.com/spreadsheets/d/e/2PACX-1vT-khzV32sk21nggqEKQ083HEbitHgS4ojE9z7T7Y9qvQ_JRCHcWBhq-HPT3W8fPA/pub?output=csv";
const CACHE_KEY="shop_products";

let products=[],cart=JSON.parse(localStorage.getItem("cart"))||[];
let page=1;perPage=20;
updateCartCount();

/* 🔄 Skeleton */
function showSkeleton(){
 productGrid.innerHTML=Array(perPage).fill(`<div class="skeleton"></div>`).join("");
}
showSkeleton();

/* 📦 Load from cache first */
if(localStorage.getItem(CACHE_KEY)){
 products=JSON.parse(localStorage.getItem(CACHE_KEY));
 render();
}

/* ⚡ Fetch fresh data */
Papa.parse(sheetUrl,{
 download:true,header:true,
 complete:r=>{
  products=r.data.filter(p=>p['Product Name']);
  localStorage.setItem(CACHE_KEY,JSON.stringify(products));
  render();
 }
});

function render(){
 let start=(page-1)*perPage,end=start+perPage;
 let html="";
 products.slice(start,end).forEach((p,i)=>{
 html+=`
 <div class="card"
  data-id="${p['Product ID']}"
  data-name="${p['Product Name']}"
  data-img="${p['Main Image']}"
  data-desc="${p['Description']||''}"
  data-price="${p['Price (Rs)']}">
  <img loading="lazy" src="${p['Main Image']}"
   onerror="this.src='https://via.placeholder.com/300'">
  <h4>${p['Product Name']}</h4>
  <div class="price">Rs.${p['Price (Rs)']}</div>
  <select id="q${i}">${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join("")}</select>
  <button onclick="add('${p['Product Name']}',${p['Price (Rs)']},'q${i}')">Add to Cart</button>
 </div>`;
 });
 productGrid.innerHTML=html;
 pageInfo.innerText=`Page ${page}`;

 document.querySelectorAll(".card img,.card h4").forEach(e=>{
  e.onclick=()=>{
   let d=e.parentElement.dataset;
   openProduct(d.name,d.img,d.desc,d.price);
  }
 });
}

function openProduct(n,i,d,p){
 pName.innerText=n;pImg.src=i;pDesc.innerText=d;pPrice.innerText=p;
 productModal.style.display="block";
}
function closeProduct(){productModal.style.display="none"}

function nextPage(){if(page*perPage<products.length){page++;render()}}
function prevPage(){if(page>1){page--;render()}}

function add(n,p,q){
 let qty=parseInt(document.getElementById(q).value);
 let card=document.getElementById(q).closest(".card");
 let id=card.dataset.id;
 let f=cart.find(i=>i.id===id);
 f?f.qty+=qty:cart.push({id,name:n,price:p,qty});
 save();
}

function save(){
 localStorage.setItem("cart",JSON.stringify(cart));
 updateCartCount();
}
function updateCartCount(){
 let c=cart.reduce((a,b)=>a+b.qty,0);
 cartCount.innerText=cartCountBottom.innerText=c;
}

function openCart(){cartModal.style.display="block";showCart()}
function closeCart(){cartModal.style.display="none"}

function showCart(){
 let t=0;cartItems.innerHTML="";
 cart.forEach((i,x)=>{
 t+=i.price*i.qty;
 cartItems.innerHTML+=`
 <div class="cartItem">
  <div>${i.name}<br>Rs.${i.price} × ${i.qty}</div>
  <div>
   <button onclick="cart[x].qty++;save();showCart()">+</button>
   <button onclick="cart[x].qty--;if(cart[x].qty<=0)cart.splice(x,1);save();showCart()">−</button>
  </div>
 </div>`;
 });
 total.innerText=t;
}

function whatsappOrder(){
 let msg=`Hello 👋%0A%0A🛒 *My Order Details* %0A%0A`;
 let t=0;
 cart.forEach((i,idx)=>{
  msg+=`${idx+1}. ${i.name}%0A`;
  msg+=`   ID: ${i.id}%0A   Qty: ${i.qty}%0A   Rs.${i.price*i.qty}%0A%0A`;
  t+=i.price*i.qty;
 });
 msg+=`*Total*: Rs.${t}%0AThank you 🙏`;
 window.open(`https://wa.me/94725989935?text=${msg}`);
}
</script>

</body>
  </html>
